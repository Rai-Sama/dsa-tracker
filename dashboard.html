<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Problem Log</title>
  <style>
    :root {
      --bg-color: #0f172a; --card-bg: #1e293b; --border-color: #334155;
      --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8;
      --accent-hover: #0284c7; --green: #22c55e; --yellow: #eab308; --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    
    .grid-layout { display: grid; grid-template-columns: 340px 1fr; gap: 24px; }
    @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }
    
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
    form { display: flex; flex-direction: column; gap: 14px; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; font-size: 0.9rem; }
    input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
    textarea { resize: vertical; min-height: 90px; }
    button { background: var(--accent); color: #0f172a; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); color: #fff; }
    
    .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; background: var(--card-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); }
    .search-bar { flex: 1; min-width: 200px; }
    
    .problem-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 12px; position: relative; transition: border 0.2s;}
    .problem-card.is-important { border-left: 4px solid var(--yellow); border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
    
    .problem-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .problem-title-group { display: flex; align-items: center; gap: 8px; }
    .problem-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    .problem-title a { color: var(--accent); text-decoration: none; }
    .problem-title a:hover { text-decoration: underline; }
    
    .star-btn { background: none; border: none; padding: 0; font-size: 1.2rem; cursor: pointer; color: var(--border-color); transition: color 0.2s; display: flex; align-items: center; }
    .star-btn.active { color: var(--yellow); }
    .star-btn:hover { transform: scale(1.1); }
    
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .badge-solved { background: rgba(34, 197, 94, 0.2); color: var(--green); }
    .badge-hint { background: rgba(234, 179, 8, 0.2); color: var(--yellow); }
    .badge-failed { background: rgba(239, 68, 68, 0.2); color: var(--red); }
    
    .meta-info { font-size: 0.8rem; color: var(--text-muted); margin: 6px 0 12px 0; display: flex; gap: 16px; flex-wrap: wrap; }
    .tags-list { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag { background: #334155; color: #cbd5e1; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .tag:hover { background: var(--accent); color: #0f172a; }
    
    .notes { font-size: 0.9rem; background: #0f172a; padding: 10px; border-radius: 6px; border-left: 3px solid var(--accent); white-space: pre-wrap; }
    .card-actions { margin-top: 10px; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-small { padding: 4px 10px; font-size: 0.8rem; background: #334155; color: var(--text-main); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--red); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>DSA Logbook</h1>
      <div>
        <button class="btn-small" id="exportBtn">Export JSON</button>
        <button class="btn-small" id="importBtn">Import JSON</button>
        <input type="file" id="fileInput" style="display:none" accept=".json">
      </div>
    </header>

    <div class="grid-layout">
      <!-- Manual Log Form -->
      <div class="card" style="align-self: start;">
        <h2 style="font-size: 1.1rem; margin-bottom: 12px;" id="formTitle">Log Problem Manually</h2>
        <form id="dsaForm">
          <input type="hidden" id="editIndex" value="-1">
          <div><label>Problem Title</label><input type="text" id="title" required placeholder="e.g. 2Sum"></div>
          <div>
            <label>Platform & URL</label>
            <div style="display: flex; gap: 6px;">
              <select id="platform" style="width: 40%;"><option value="LeetCode">LeetCode</option><option value="NeetCode">NeetCode</option><option value="Other">Other</option></select>
              <input type="url" id="url" placeholder="https://...">
            </div>
          </div>
          <div><label>Topics (comma separated)</label><input type="text" id="topics" placeholder="Arrays, Two Pointers"></div>
          <div>
            <label>Outcome Status</label>
            <select id="status"><option value="solved">Solved Solitary</option><option value="hint">Needed Hint</option><option value="failed">Couldn't Solve</option></select>
          </div>
          <div><label>Notes & Takeaways</label><textarea id="notes" placeholder="Key takeaways..."></textarea></div>
          
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--yellow); font-weight:600;">
            <input type="checkbox" id="isImportant" style="width:16px; height:16px;">⭐ Mark for Review
          </label>

          <button type="submit" id="submitBtn" style="margin-top: 8px;">Save Entry</button>
          <button type="button" id="cancelBtn" style="display:none; background: #334155;">Cancel Edit</button>
        </form>
      </div>

      <!-- Log Dashboard -->
      <div>
        <!-- Advanced Filters -->
        <div class="controls">
          <input type="text" id="search" class="search-bar" placeholder="Search titles or notes...">
          
          <select id="filterTopic" style="width: auto; min-width: 140px;">
            <option value="all">All Topics</option>
            <!-- Dynamically populated -->
          </select>

          <select id="filterStatus" style="width: auto;">
            <option value="all">All Statuses</option>
            <option value="solved">Solved</option>
            <option value="hint">Hinted</option>
            <option value="failed">Failed</option>
          </select>

          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:600; color:var(--yellow); white-space:nowrap;">
            <input type="checkbox" id="filterImportant"> ⭐ Review Only
          </label>
        </div>

        <div id="problemsList"></div>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
